<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>churchTeam Prompt Runner</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0d1117; color: #e6edf3;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
  padding: 28px 24px; min-height: 100vh;
}
header { margin-bottom: 28px; }
header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
header p  { font-size: 13px; color: #7d8590; }

.live { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: #3fb950; margin-right: 6px; animation: blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

.stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 32px; }
@media(max-width:700px){ .stats{grid-template-columns:repeat(2,1fr);} }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px 18px; }
.card .label { font-size: 11px; color: #7d8590; text-transform: uppercase; letter-spacing:.06em; margin-bottom:8px; }
.card .value { font-size: 28px; font-weight: 700; line-height: 1; }
.card .sub   { font-size: 12px; color: #7d8590; margin-top: 6px; }
.bar-wrap { height: 5px; background: #21262d; border-radius: 99px; overflow: hidden; margin-top: 10px; }
.bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg,#1f6feb,#3fb950); transition: width .6s; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 20px; }
.leg { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #7d8590; }
.dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

.section-title {
  font-size: 11px; font-weight: 600; color: #7d8590;
  text-transform: uppercase; letter-spacing:.08em;
  border-bottom: 1px solid #21262d; padding-bottom: 8px; margin-bottom: 14px;
}
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px,1fr)); gap: 10px; }

.unit { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px 14px; transition: border-color .3s, background .3s; }
.unit.done        { border-color: #3fb950; background: #0d1f17; }
.unit.in-progress { border-color: #58a6ff; background: #0d1626; animation: pulse 2s infinite; }
.unit.warn        { border-color: #d29922; background: #1c1810; }
.unit.pending     { opacity: .45; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(88,166,255,.4)} 50%{box-shadow:0 0 0 5px rgba(88,166,255,0)} }

.unit-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
.unit-name { font-size: 13px; font-weight: 600; line-height: 1.35; }
.badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px;
  white-space: nowrap; text-transform: uppercase; letter-spacing:.05em; flex-shrink: 0; }
.badge-done     { background: rgba(63,185,80,.15);  color: #3fb950; }
.badge-progress { background: rgba(88,166,255,.15); color: #58a6ff; }
.badge-warn     { background: rgba(210,153,34,.15); color: #d29922; }
.badge-pending  { background: rgba(48,54,61,.5);    color: #7d8590; }

.unit-range { font-size: 11px; color: #7d8590; margin-bottom: 8px; }
.steps { display: flex; flex-wrap: wrap; gap: 3px; }
.step {
  width: 22px; height: 22px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 700; cursor: default;
  transition: transform .1s, background .3s; user-select: none;
}
.step:hover { transform: scale(1.25); z-index:1; position:relative; }
.step.s-done       { background: #3fb950; color: #0d1f17; }
.step.s-clear      { background: #0d2b1a; border: 1px solid #3fb950; color: #3fb950; font-size: 7px; }
.step.s-suspicious { background: #d29922; color: #1c1810; }
.step.s-current    { background: #58a6ff; color: #0d1626; animation: cur 1s infinite; }
.step.s-failed     { background: #f85149; color: #fff; }
.step.s-pending    { background: #21262d; color: #7d8590; }
@keyframes cur { 0%,100%{opacity:1} 50%{opacity:.4} }

footer { margin-top: 36px; text-align: center; font-size: 11px; color: #484f58; }
</style>
</head>
<body>

<header>
  <h1>⚡ churchTeam Prompt Runner</h1>
  <p><span class="live" id="liveDot"></span><span id="lastUpdated">로딩 중…</span> · <span id="countdown">30</span>초 후 갱신</p>
</header>

<div class="stats">
  <div class="card">
    <div class="label">전체 진행률</div>
    <div class="value"><span id="pct">0</span>%</div>
    <div class="bar-wrap"><div class="bar-fill" id="bar" style="width:0%"></div></div>
    <div class="sub"><span id="doneCount">0</span> / <span id="totalCount">110</span> step 완료</div>
  </div>
  <div class="card">
    <div class="label">현재 위치</div>
    <div class="value">Step <span id="curStep">-</span></div>
    <div class="sub" id="curUnit">-</div>
  </div>
  <div class="card">
    <div class="label">단위 완료</div>
    <div class="value"><span id="unitDone">0</span> / 35</div>
    <div class="sub"><span id="unitPct">0</span>% 단위 완료</div>
  </div>
  <div class="card">
    <div class="label">실행 상태</div>
    <div class="value" style="font-size:18px" id="statusEl">-</div>
    <div class="sub" id="warnEl"></div>
  </div>
</div>

<div class="legend">
  <div class="leg"><div class="dot" style="background:#3fb950"></div>완료</div>
  <div class="leg"><div class="dot" style="background:#0d2b1a;border:1px solid #3fb950"></div>/clear</div>
  <div class="leg"><div class="dot" style="background:#d29922"></div>suspicious</div>
  <div class="leg"><div class="dot" style="background:#58a6ff"></div>현재/진행</div>
  <div class="leg"><div class="dot" style="background:#f85149"></div>실패</div>
  <div class="leg"><div class="dot" style="background:#21262d"></div>대기</div>
</div>

<div class="section-title">단위별 진행 현황 · 35단위 · /clear 경계 기준</div>
<div class="units" id="unitsEl"></div>

<footer>localhost:8080/dashboard.html · state.json 30초 자동 폴링</footer>

<script>
const UNITS = [
  [1,3,   "U01","리서치 기초 — 로컬 실행 원칙"],
  [4,6,   "U02","리서치 R2 — 기술 선택지 확보"],
  [7,9,   "U03","리서치 R3 — 코딩·구현 트레이드오프"],
  [10,12, "U04","리서치 R4 — 외부 연동 축"],
  [13,14, "U05","리서치 저장 — 누락·요약 금지"],
  [15,17, "U06","PRD 초안 성찰 1"],
  [18,20, "U07","PRD 초안 성찰 2"],
  [21,23, "U08","PRD 초안 성찰 3"],
  [24,26, "U09","PRD 초안 성찰 4"],
  [27,29, "U10","PRD 초안 성찰 5"],
  [30,33, "U11","PRD 1차 반영"],
  [34,36, "U12","제1 목적 정합성 성찰"],
  [37,39, "U13","목적 반영 갱신"],
  [40,42, "U14","PRD 마무리 성찰"],
  [43,47, "U15","PRD 확정 + workflow-idea 전환"],
  [48,50, "U16","workflow-idea 초안"],
  [51,53, "U17","workflow-idea 성찰"],
  [54,58, "U18","workflow-idea 확정"],
  [59,61, "U19","workflow.md 초안"],
  [62,64, "U20","workflow.md 성찰"],
  [65,67, "U21","workflow.md 반영"],
  [68,70, "U22","적대적 성찰 A"],
  [71,73, "U23","적대적 성찰 B — code convention"],
  [74,76, "U24","적대적 성찰 C — SOT 다중 에이전트"],
  [77,79, "U25","workflow-coding 초안"],
  [80,82, "U26","코딩 성찰 1"],
  [83,85, "U27","코딩 성찰 2"],
  [86,88, "U28","설계 결함 재조사"],
  [89,91, "U29","PRD 적대 성찰"],
  [92,95, "U30","Infra Build 구현 ⚙️"],
  [96,98, "U31","구현 성찰"],
  [99,101,"U32","구현 보강"],
  [102,104,"U33","구현 마무리"],
  [105,107,"U34","최종 검증"],
  [108,110,"U35","테스트 전략 + 종료"],
];

const CLEAR_SET = new Set([3,6,9,12,14,17,20,23,26,29,33,36,39,42,47,50,53,58,61,64,67,70,73,76,79,82,85,88,91,95,98,101,104,107,110]);

let countdown = 30;

async function fetchState() {
  try {
    const r = await fetch("state.json?_=" + Date.now());
    if (!r.ok) throw new Error("fetch failed");
    return await r.json();
  } catch(e) { return null; }
}

function render(s) {
  if (!s) {
    document.getElementById("statusEl").textContent = "❌ state.json 로드 실패";
    document.getElementById("liveDot").style.background = "#f85149";
    return;
  }
  document.getElementById("liveDot").style.background = "#3fb950";

  const doneSet  = new Set(s.completed || []);
  const susSet   = new Set(s.suspicious || []);
  const failSet  = new Set(s.failed || []);
  const cur      = s.current_step;
  const total    = s.total || 110;
  const doneCnt  = (s.completed || []).length;

  const pct = Math.round(doneCnt / total * 100);
  document.getElementById("pct").textContent = pct;
  document.getElementById("bar").style.width = pct + "%";
  document.getElementById("doneCount").textContent = doneCnt;
  document.getElementById("totalCount").textContent = total;
  document.getElementById("curStep").textContent = cur ?? "-";

  const curU = UNITS.find(([a,b]) => cur >= a && cur <= b);
  document.getElementById("curUnit").textContent = curU ? `${curU[2]} ${curU[3]}` : "-";

  const statusLabel = {running:"🟢 실행 중", completed:"✅ 완료", failed:"🔴 실패", interrupted:"⏸ 중단됨"};
  document.getElementById("statusEl").textContent = statusLabel[s.status] || s.status || "-";
  document.getElementById("warnEl").textContent = susSet.size ? `⚠ suspicious: ${[...susSet].join(", ")}` : "";

  try {
    document.getElementById("lastUpdated").textContent =
      "마지막 갱신: " + new Date(s.last_updated).toLocaleString("ko-KR");
  } catch(_){}

  let unitDone = 0;
  document.getElementById("unitsEl").innerHTML = UNITS.map(([s1,s2,uid,desc]) => {
    const range = [];
    for (let i = s1; i <= s2; i++) range.push(i);

    const allDone  = range.every(n => doneSet.has(n));
    const hasSus   = range.some(n => susSet.has(n));
    const isCur    = range.includes(cur);
    const anyDone  = range.some(n => doneSet.has(n));

    let unitCls = "pending", badgeCls = "badge-pending", badgeText = "대기";
    if (allDone)                   { unitCls = "done";        badgeCls = "badge-done";     badgeText = "✓ 완료"; unitDone++; }
    else if (hasSus && !allDone)   { unitCls = "warn";        badgeCls = "badge-warn";     badgeText = "⚠ 주의"; }
    else if (isCur || anyDone)     { unitCls = "in-progress"; badgeCls = "badge-progress"; badgeText = "▶ 진행"; }

    const boxes = range.map(n => {
      let cls = "s-pending";
      let label = n;
      if (CLEAR_SET.has(n) && doneSet.has(n)) { cls = "s-clear"; label = "✕"; }
      else if (susSet.has(n))  cls = "s-suspicious";
      else if (failSet.has(n)) cls = "s-failed";
      else if (doneSet.has(n)) cls = "s-done";
      else if (n === cur)      cls = "s-current";
      return `<div class="step ${cls}" title="Step ${n}">${label}</div>`;
    }).join("");

    return `
<div class="unit ${unitCls}">
  <div class="unit-head">
    <span class="unit-name">${uid} · ${desc}</span>
    <span class="badge ${badgeCls}">${badgeText}</span>
  </div>
  <div class="unit-range">Step ${s1} – ${s2}</div>
  <div class="steps">${boxes}</div>
</div>`;
  }).join("");

  document.getElementById("unitDone").textContent = unitDone;
  document.getElementById("unitPct").textContent = Math.round(unitDone / UNITS.length * 100);
}

async function tick() {
  const s = await fetchState();
  render(s);
  countdown = 30;
}

// 카운트다운
setInterval(() => {
  countdown--;
  document.getElementById("countdown").textContent = countdown;
  if (countdown <= 0) tick();
}, 1000);

tick();
</script>
</body>
</html>
