#
# Sector Design Principles:
#   - Each sector = distinct investment thesis (different FRED triggers or signal types)
#   - Korea market focus: semiconductors, 2차전지, 조선, 방산, K-콘텐츠 as first-class sectors
#   - GICS removed: 'industrials' and 'materials' replaced by granular sub-sectors
#
# Sector Index (20):
#   AI/Tech Stack:    semiconductor, semiconductor_equipment, ai_platform, technology,
#                     optical_network, cybersecurity
#   Energy/Infra:     power_infrastructure, nuclear, energy
