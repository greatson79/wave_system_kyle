# Category thresholds (P6: Python-First — numeric only, no LLM judgment)
# Used by stock_selector.classify_category() and agent_consensus.py
category_thresholds:
  bullish_threshold: 0.01        # +1% (v3.6 I-4: relaxed from +2%)
  neutral_band: 0.03             # ±3%
  min_weeks_tracked: 4           # v3.6 I-7: Category B zero-guard
  min_abs_count: 1               # absolute safety net
  category_b_min_theme_weeks: 4  # minimum weeks theme must be trackable
